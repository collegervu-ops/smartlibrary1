<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><title>RV University Smart Library</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Syne:wght@700;800&family=DM+Sans:wght@400;500;700&display=swap">
<style>
:root{--bg:#fff7e6;--sf:#fff;--tx:#0d0d1a;--ink:#0d0d1a;--sh:#0d0d1a;--lime:#c6ff3d;--pink:#ff4fa3;--pur:#8b5cf6;--yel:#ffd93d;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px);background:var(--bg)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0e1033;--sf:#1b1e5a;--tx:#f5f0e1;--ink:#f5f0e1;--sh:#04051a;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0e1033;--sf:#1b1e5a;--tx:#f5f0e1;--ink:#f5f0e1;--sh:#04051a;color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;color:var(--tx);font:16px/1.5 "DM Sans",system-ui,sans-serif;overflow-x:hidden}
.mesh{position:fixed;inset:0;z-index:-1;background:radial-gradient(circle at 15% 15%,rgba(198,255,61,.55),transparent 40%),radial-gradient(circle at 85% 25%,rgba(255,79,163,.4),transparent 40%),radial-gradient(circle at 50% 95%,rgba(139,92,246,.45),transparent 45%),var(--bg);background-size:150% 150%;animation:mesh 14s ease-in-out infinite alternate}
@keyframes mesh{to{background-position:100% 100%,0 100%,100% 0,0 0}}
.grain{position:fixed;inset:-50%;pointer-events:none;z-index:50;opacity:.13;background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='2'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>");animation:gr .8s steps(6) infinite}
@keyframes gr{20%{transform:translate(-3%,2%)}40%{transform:translate(2%,-3%)}60%{transform:translate(-2%,-1%)}80%{transform:translate(3%,3%)}}
.disp{font-family:Syne,Impact,"Arial Black",sans-serif;font-weight:800;letter-spacing:-.03em;line-height:.95;text-transform:uppercase;margin:0}
header{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;padding:14px 20px}
.logo{font-size:28px}.logo i{font-style:normal;background:var(--pink);color:#0d0d1a;border:3px solid var(--ink);padding:0 8px;border-radius:10px;display:inline-block;transform:rotate(-4deg);margin-left:4px}
.chip{display:inline-block;border:3px solid var(--ink);background:var(--yel);color:#0d0d1a;border-radius:99px;padding:2px 12px;font-weight:700;font-size:13px}
.mq{overflow:hidden;border-block:3px solid var(--ink);background:var(--lime);color:#0d0d1a;font-weight:800;text-transform:uppercase;white-space:nowrap}
.mq div{display:flex;width:max-content;animation:mq 26s linear infinite}.mq span{padding:8px 22px}
@keyframes mq{to{transform:translateX(-50%)}}
main{max-width:1080px;margin:0 auto;padding:22px 16px 60px;position:relative}
.view.pop{animation:pop .6s cubic-bezier(.34,1.56,.64,1)}
@keyframes pop{from{opacity:0;transform:translateY(34px) scale(.95)}}
.c{background:var(--sf);color:var(--tx);border:3px solid var(--ink);border-radius:20px;box-shadow:6px 6px 0 var(--sh);padding:18px;transition:transform .2s cubic-bezier(.34,1.56,.64,1),box-shadow .2s}
.c:hover{transform:translate(-3px,-3px) rotate(-.4deg);box-shadow:10px 10px 0 var(--sh)}
.lime{background:var(--lime);color:#0d0d1a}.pink{background:var(--pink);color:#0d0d1a}.pur{background:var(--pur);color:#fff}.yel{background:var(--yel);color:#0d0d1a}
.bento{display:grid;grid-template-columns:repeat(auto-fill,minmax(235px,1fr));gap:18px;margin:0 0 22px}
.st{display:flex;flex-direction:column}.st b{font:800 clamp(34px,6vw,52px)/1 Syne,Impact,sans-serif}.st span{font-weight:700;text-transform:uppercase;font-size:13px}
.hero{margin-bottom:22px;padding:26px;position:relative;overflow:hidden}.hero h2{font-size:clamp(34px,7.5vw,76px);margin-bottom:16px}
input{width:100%;padding:12px 14px;border:3px solid var(--ink);border-radius:14px;background:#fff;color:#0d0d1a;font:inherit;font-weight:500;margin:4px 0 12px;box-shadow:3px 3px 0 var(--sh);outline:none}
input:focus{box-shadow:5px 5px 0 var(--pink)}label{font-weight:700;font-size:13px;text-transform:uppercase}
.b{background:var(--lime);color:#0d0d1a;border:3px solid var(--ink);border-radius:14px;box-shadow:4px 4px 0 var(--sh);padding:9px 16px;font:800 14px "DM Sans",sans-serif;text-transform:uppercase;cursor:pointer;transform:translate(var(--mx,0px),var(--my,0px));transition:transform .15s,box-shadow .15s,background .2s}
.b:hover{box-shadow:7px 7px 0 var(--sh);transform:translate(calc(var(--mx,0px) - 2px),calc(var(--my,0px) - 2px))}
.b:active{box-shadow:0 0 0 var(--sh);transform:translate(3px,3px)}.b.p{background:var(--pink)}.b.v{background:var(--pur);color:#fff}.b.w{background:#fff}.b.on{background:var(--yel)}
.row{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:18px}.chips{display:flex;gap:8px;flex-wrap:wrap}
.book h3{font:800 22px/1.05 Syne,Impact,sans-serif;margin:8px 0 4px}.book p{margin:0 0 10px;font-weight:500}
.tag{display:inline-block;border:2px solid #0d0d1a;background:#fff;color:#0d0d1a;border-radius:8px;padding:1px 8px;font-size:12px;font-weight:800;margin-right:4px}
.cs{background:#fff;color:#0d0d1a;border-radius:20px}
.sc{overflow-x:auto;padding:0}table{border-collapse:collapse;width:100%;min-width:820px}th{background:var(--pur);color:#fff;text-transform:uppercase;font-size:12px}
th,td{text-align:left;padding:10px 12px;border-bottom:3px solid var(--ink);font-size:14px}tr:last-child td{border:0}
.shape{position:absolute;pointer-events:none;border:3px solid var(--ink);animation:fl 6s ease-in-out infinite alternate}
@keyframes fl{to{transform:translateY(-14px) rotate(25deg)}}
.cert{text-align:center;border:4px dashed var(--ink);padding:26px;border-radius:16px;position:relative}.stamp{display:inline-block;transform:rotate(-8deg);border:4px solid #0d0d1a;padding:4px 16px;font:800 28px Syne,Impact,sans-serif;background:var(--lime);color:#0d0d1a;margin-bottom:12px}
.bad{font-weight:800}.mu{font-weight:500;opacity:.8;font-size:14px}
.auth{max-width:520px;margin:30px auto;position:relative}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%) scale(.8);opacity:0;pointer-events:none;background:var(--yel);color:#0d0d1a;border:3px solid var(--ink);box-shadow:5px 5px 0 var(--sh);border-radius:14px;padding:10px 18px;font-weight:800;z-index:60;max-width:92%;transition:.3s cubic-bezier(.34,1.56,.64,1)}
.toast.s{opacity:1;transform:translateX(-50%) scale(1)}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:0 14px}@media(max-width:600px){.g2{grid-template-columns:1fr}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
@media print{header,.mq,.noprint,.toast,.grain,.mesh{display:none}.c{box-shadow:none}}
.brand{display:flex;align-items:center;gap:14px;flex-wrap:wrap}.rv{height:54px;background:#fff;border:3px solid var(--ink);border-radius:12px;padding:3px 8px;box-shadow:3px 3px 0 var(--sh)}
</style></head><body>
<div class="mesh"></div><div class="grain"></div>
<header><div class="brand"><img class="rv" id="lg" alt="RV University"><div class="disp logo">Smart<i>Lib</i></div></div><div id="who"></div></header>
<div class="mq"><div id="mq"></div></div>
<main id="app"></main><div class="toast" id="toast"></div>

function score(b,s){var ws=s.toLowerCase().split(/\s+/).filter(Boolean),tk=(b.t+' '+b.a+' '+(b.g||'')).toLowerCase().split(/[^a-z0-9.]+/).filter(Boolean),sc=0;
ws.forEach(function(w){var m=0;tk.forEach(function(t){if(t==w)m=Math.max(m,3);else if(t.indexOf(w)>-1&&w.length>1)m=Math.max(m,2);else if(w.length>3&&lev(w,t)<=1)m=Math.max(m,1)});sc+=m});return sc}
function bookCard(b,n){var cl=['lime','pink','pur','yel'][n%4],st=b.c>0?'<span class="tag">'+b.c+' IN STOCK</span>':'<span class="tag">SOLD OUT'+(b.q.length?' · '+b.q.length+' WAITING':'')+'</span>';
return '<div class="c book '+cl+'"><span class="tag">📍 RACK '+esc(b.rack)+' · ROW '+esc(b.row)+'</span><h3>'+esc(b.t)+'</h3><p>'+esc(b.a)+'</p>'+st+(me.role=='student'?'<div style="margin-top:12px"><button class="b w" onclick="request(\''+b.id+'\')">'+(b.c>0?'Get it':'Join waitlist')+'</button></div>':'')+'</div>'}
function recs(){var mine=S.issues.filter(function(i){return i.uid==me.id}).map(function(i){return i.bid}),tg={};
mine.forEach(function(id){(bk(id).g||'').split(' ').forEach(function(w){if(w)tg[w]=1})});
var l=S.books.filter(function(b){return mine.indexOf(b.id)<0}).map(function(b){var o=(b.g||'').split(' ').filter(function(w){return tg[w]}).length,p=S.issues.filter(function(i){return i.bid==b.id}).length;return{b:b,s:o*2+(b.c>0?1:0)+p*.3}}).sort(function(x,y){return y.s-x.s}).slice(0,3);
if(!l.length)return '';return '<h2 class="disp" style="font-size:30px;margin-bottom:14px">✨ '+(mine.length?'Picked for you':'Trending on campus')+'</h2><div class="bento">'+l.map(function(x,i){return bookCard(x.b,i+1)}).join('')+'</div>'}
function res(){var el=document.getElementById('res');if(!el)return;var rc=document.getElementById('rec');if(rc)rc.style.display=q?'none':'';
var l=S.books.map(function(b){return{b:b,s:q?score(b,q):1}}).filter(function(x){return x.s>0&&(!onlyIn||x.b.c>0)}).sort(function(x,y){return y.s-x.s});
el.innerHTML=l.length?l.map(function(x,i){return bookCard(x.b,i)}).join(''):'<div class="c yel">Nothing found 😵 Try another word or ask faculty to add it.</div>'}
function QS(w){q=w;r()}function OI(){onlyIn=!onlyIn;r()}
function stat(n,l,c){return '<div class="c st '+c+'"><b>'+n+'</b><span>'+l+'</span></div>'}
function tabs(a){return '<div class="row noprint">'+a.map(function(x){return '<button class="b '+(tab==x[0]?'on':'')+'" onclick="T(\''+x[0]+'\')">'+x[1]+'</button>'}).join('')+'</div>'}
function inp(id,l,t){return '<div><label>'+l+'</label><input id="'+id+'" '+(t||'')+'></div>'}
function authView(){var f=am=='f',n='inputmode="numeric" maxlength="10"',p='type="password" inputmode="numeric" maxlength="4"';
return '<div class="auth"><div class="shape" style="width:70px;height:70px;border-radius:50%;background:var(--pink);top:-30px;right:-14px"></div><div class="shape" style="width:56px;height:56px;background:var(--pur);bottom:-24px;left:-18px;transform:rotate(20deg)"></div>'+
'<div class="c" style="position:relative"><h2 class="disp" style="font-size:44px;margin-bottom:14px">Hey 👋<br>Who’s this?</h2><div class="row"><button class="b '+(f?'':'on')+'" onclick="M(\'s\')">🎓 Student</button><button class="b p '+(f?'on':'')+'" onclick="M(\'f\')">🧑‍🏫 Faculty terminal</button></div>'+
(!f?'<div class="row"><button class="b w '+(tab=='login'?'on':'')+'" onclick="T(\'login\')">Login</button><button class="b w '+(tab=='reg'?'on':'')+'" onclick="T(\'reg\')">New here? Register</button></div>':'')+
(!f&&tab=='reg'?'<div class="g2">'+inp('ru','USN (e.g. RVUM26CSE122)')+inp('rk','Activation code','inputmode="numeric" maxlength="6"')+inp('rp','Phone',n)+inp('rc','Class')+inp('rco','Course')+inp('rs','School')+'</div>'+inp('rpin','Set 4-digit PIN',p)+'<p class="mu">Open only to students on the eligible list. Get your activation code from the library desk. Your name is picked up from your USN.</p><button class="b" onclick="reg()">Create account</button>':
inp('lp','Phone number',n)+inp('ln','4-digit PIN',p)+'<button class="b" onclick="login()">Enter</button>'+(f?' <button class="b w" onclick="fill()">Fill demo login</button><p class="mu">Demo faculty: 9999999999 / PIN 0000</p>':''))+'</div></div>'}
function discover(){var st=me.role=='student',h='<div class="c pur hero"><div class="shape" style="width:90px;height:90px;border-radius:50%;background:var(--lime);right:30px;top:-30px"></div><div class="shape" style="width:0;height:0;border:3px solid var(--ink);border-width:0 34px 58px;border-color:transparent transparent var(--yel);right:140px;bottom:-12px;animation-delay:-2s"></div><h2 class="disp">'+(st?'What are you<br>reading next?':'The<br>catalogue')+'</h2>'+
'<input id="sq" placeholder="Smart search: title, author, topic… (typos ok)" value="'+esc(q)+'" oninput="q=this.value;res()"><div class="chips">'+['coding','maths','biography','habits'].map(function(w){return '<button class="b w" onclick="QS(\''+w+'\')">'+w+'</button>'}).join('')+'<button class="b '+(onlyIn?'on':'p')+'" onclick="OI()">'+(onlyIn?'✓ ':'')+'In stock only</button></div></div>';
return h+(st?'<div id="rec">'+recs()+'</div>':'')+'<div id="res" class="bento"></div>'}
function mine(){var a=active(me.id),h=S.issues.filter(function(i){return i.uid==me.id&&i.ret});
return (a.length?'<div class="bento">'+a.map(function(i,n){var f=fine(i),b=bk(i.bid);return '<div class="c book '+['lime','pink','pur','yel'][n%4]+'"><span class="tag">DUE '+dt(i.due).toUpperCase()+'</span><h3>'+esc(b.t)+'</h3><p>Issued '+dt(i.from)+' · Rack '+esc(b.rack)+', Row '+esc(b.row)+'</p>'+(f?'<span class="tag">⚠ FINE ₹'+f+'</span>':'<span class="tag">✓ ON TIME</span>')+'</div>'}).join('')+'</div>':'<div class="c yel">No books out. Go discover something 📚</div>')+
(h.length?'<h2 class="disp" style="font-size:28px;margin:22px 0 12px">History</h2><div class="c">'+h.map(function(i){return '<div>'+esc(bk(i.bid).t)+' <span class="mu">· returned '+dt(i.ret)+(i.fine?' · fine paid ₹'+i.fine:'')+'</span></div>'}).join('')+'</div>':'')}
function clear(){var a=active(me.id),f=a.reduce(function(s,i){return s+fine(i)},0);
if(a.length)return '<div class="c pink"><h2 class="disp" style="font-size:36px">Not yet 🚫</h2><p>Return '+a.length+' book(s)'+(f?' and clear ₹'+f+' fine':'')+' to unlock your certificate.</p></div>';
return '<div class="c cs"><div class="cert"><img src="'+LOGO+'" alt="RV University" style="height:70px;margin-bottom:10px"><br><div class="stamp">NO DUES ✓</div><h2 class="disp" style="font-size:30px">Library clearance</h2><p><b>'+esc(me.name)+'</b> (USN '+esc(me.usn)+'), '+esc(me.course)+', '+esc(me.cls)+', '+esc(me.school)+', has no books or fines pending.</p><p class="mu">Issued '+today().toLocaleDateString('en-IN',{day:'numeric',month:'long',year:'numeric'})+'</p></div><p class="noprint"><button class="b" onclick="window.print()">Download / Print</button></p></div>'}
function issued(){var a=S.issues.filter(function(i){return !i.ret});
return '<div class="c sc"><table><tr><th>Student</th><th>USN</th><th>Class</th><th>Course</th><th>School</th><th>Phone</th><th>Book</th><th>Due</th><th>Fine</th><th></th></tr>'+
(a.map(function(i){var u=us(i.uid),f=fine(i);return '<tr><td><b>'+esc(u.name)+'</b></td><td>'+esc(u.usn)+'</td><td>'+esc(u.cls)+'</td><td>'+esc(u.course)+'</td><td>'+esc(u.school)+'</td><td>'+esc(u.phone)+'</td><td>'+esc(bk(i.bid).t)+'</td><td>'+dt(i.due)+'</td><td>'+(f?'<span class="tag" style="background:var(--pink)">₹'+f+'</span>':'₹0')+'</td><td><button class="b" onclick="ret(\''+i.id+'\')">Returned</button></td></tr>'}).join('')||'<tr><td colspan="10">Nothing issued right now. Students’ requests will show up here.</td></tr>')+'</table></div>'}
function add(){return '<div class="c lime"><h2 class="disp" style="font-size:34px;margin-bottom:14px">Add a book</h2><div class="g2">'+inp('bt','Title')+inp('ba','Author')+inp('bc','Copies','type="number" min="0"')+inp('bg','Topics (optional, for smart search)')+inp('bk','Rack (e.g. A)')+inp('bw','Row (e.g. 2)')+'</div><button class="b v" onclick="addBook()">Save book</button></div>'}
function wait(){var l=S.books.filter(function(b){return b.q.length});return l.length?'<div class="bento">'+l.map(function(b,n){return '<div class="c book '+['pink','yel','lime','pur'][n%4]+'"><h3>'+esc(b.t)+'</h3>'+b.q.map(function(id,k){var u=us(id);return '<p>'+(k+1)+'. '+esc(u.name)+' · '+esc(u.usn)+'</p>'}).join('')+'</div>'}).join('')+'</div>':'<div class="c yel">Nobody is waiting 🎉</div>'}
function studStats(){var a=active(me.id),f=a.reduce(function(s,i){return s+fine(i)},0),nx=a.map(function(i){return i.due}).sort()[0];return '<div class="bento">'+stat(a.length,'books out','lime')+stat('₹'+f,'fine due','pink')+stat(nx?dt(nx):'—','next due','pur')+'</div>'}
function facStats(){var a=S.issues.filter(function(i){return !i.ret});return '<div class="bento">'+stat(a.length,'books issued','lime')+stat(a.filter(function(i){return fine(i)>0}).length,'overdue','pink')+stat(S.books.filter(function(b){return b.c==0}).length,'sold out','pur')+stat(S.books.reduce(function(s,b){return s+b.q.length},0),'in waitlists','yel')+'</div>'}
function eligView(){var rg={};S.users.forEach(function(u){if(u.usn)rg[u.usn.toUpperCase()]=1});
return '<p class="noprint"><button class="b" onclick="window.print()">Print list with codes</button></p><div class="c sc"><table><tr><th>#</th><th>USN</th><th>Name</th><th>Code</th><th>Status</th></tr>'+ELIG.map(function(e,i){return '<tr><td>'+(i+1)+'</td><td>'+e[0]+'</td><td>'+esc(e[1])+'</td><td><b>'+code(e[0])+'</b></td><td>'+(rg[e[0]]?'<span class="tag" style="background:var(--lime)">REGISTERED</span>':'—')+'</td></tr>'}).join('')+'</table></div>'}
function r(anim){var A=document.getElementById('app'),W=document.getElementById('who');
if(!me){W.innerHTML='';A.innerHTML='<div class="view'+(anim?' pop':'')+'">'+authView()+'</div>';return}
var st=me.role=='student',fa=!st;
W.innerHTML='<span class="chip">'+(fa?'🧑‍🏫 FACULTY TERMINAL':'🎓 '+esc(me.name))+'</span> <button class="b w" onclick="out()">Logout</button>';
var h=(st?studStats():facStats())+tabs(st?[['search','🔍 Discover'],['mine','📚 My books'],['clear','🧾 Clearance']]:[['issued','📋 Issued books'],['add','➕ Add book'],['wait','⏳ Waitlists'],['elig','🎓 Eligible list'],['search','🔍 Catalogue']]);
var b=tab=='search'?discover():tab=='mine'?mine():tab=='clear'?clear():tab=='issued'?issued():tab=='add'?add():tab=='elig'?eligView():wait();
A.innerHTML='<div class="view'+(anim?' pop':'')+'">'+h+b+'</div>';res()}
document.addEventListener('mousemove',function(e){var b=e.target.closest&&e.target.closest('.b');if(!b)return;var x=b.getBoundingClientRect();b.style.setProperty('--mx',((e.clientX-x.left-x.width/2)*.2)+'px');b.style.setProperty('--my',((e.clientY-x.top-x.height/2)*.3)+'px')});
document.addEventListener('mouseout',function(e){var b=e.target.closest&&e.target.closest('.b');if(b){b.style.setProperty('--mx','0px');b.style.setProperty('--my','0px')}});
r(1);
</script></body></html>
